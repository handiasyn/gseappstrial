<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LGS Super Apps — Interactive Prototype</title>
<style>
:root{--bg:#f5f7fb;--surface:#fff;--ink:#17243a;--muted:#748096;--line:#e6eaf0;--accent:#c9283c;--soft:#fff0f2;--green:#16966a;--shadow:0 10px 35px #1d30400a}
[data-theme=dark]{--bg:#0c1524;--surface:#18253a;--ink:#f4f7fc;--muted:#a3b0c2;--line:#314158;--soft:#432631;--shadow:none}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #db8190} .app{display:flex;min-height:100vh}.sidebar{width:245px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);padding:24px 14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:11px;padding:0 12px 24px}.logo{background:var(--accent);color:white;border-radius:13px;padding:11px;font-size:23px;font-weight:900}.brand small{display:block;color:var(--muted)}.navlabel{font-size:10px;letter-spacing:1.4px;color:var(--muted);font-weight:800;margin:20px 13px 7px}.nav{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:10px;margin:2px 0}.nav:hover,.nav.active{background:var(--soft);color:var(--accent);font-weight:700}.main{flex:1;min-width:0}.top{background:var(--surface);border-bottom:1px solid var(--line);padding:15px 32px;display:flex;align-items:center;justify-content:space-between;gap:15px}.topright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.role{border:1px solid var(--line);border-radius:10px;padding:9px;background:var(--surface);color:var(--ink)}.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;color:var(--ink)}.content{max-width:1220px;margin:auto;padding:30px 32px 65px}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:1.5px}.heading{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:25px}h1{font-size:29px;margin:4px 0}h2{font-size:17px;margin:0 0 14px}p{color:var(--muted);margin:5px 0}.btn{background:var(--accent);color:white;border:0;border-radius:10px;padding:11px 17px;font-weight:700}.btn.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}.metric{font-size:27px;font-weight:800;margin:8px 0}.sub{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-top:20px}.services{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.service{border:1px solid var(--line);border-radius:13px;background:var(--surface);color:var(--ink);text-align:left;padding:16px;min-height:114px;transition:.2s}.service:hover{border-color:var(--accent);transform:translateY(-2px)}.glyph{display:inline-flex;width:36px;height:36px;align-items:center;justify-content:center;background:var(--soft);border-radius:10px;font-size:19px;margin-bottom:9px}.service strong{display:block;font-size:13px}.service span:last-child{display:block;color:var(--muted);font-size:11px}.points{background:linear-gradient(130deg,#263d62,#12233e);border:0;color:white}.points p,.points .sub{color:#c2d0e3}.points .metric{font-size:40px}.pill{display:inline-block;padding:4px 9px;border-radius:99px;background:#e5f8f0;color:#137d5c;font-size:11px;font-weight:700}.activity{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:12px 0;gap:10px}.activity:last-child{border:0}.activity small{display:block;color:var(--muted)}.tag{font-size:11px;font-weight:800;color:var(--green)}.section{margin-top:25px}.hide{display:none!important}.field{display:flex;flex-direction:column;gap:5px;margin:12px 0}.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:11px;width:100%}.field textarea{min-height:90px;resize:vertical}.modalwrap{position:fixed;inset:0;background:#07111c9c;display:none;align-items:center;justify-content:center;padding:15px;z-index:5}.modalwrap.show{display:flex}.modal{background:var(--surface);color:var(--ink);width:min(520px,100%);max-height:90vh;overflow:auto;padding:25px;border-radius:18px}.modalhead{display:flex;justify-content:space-between;align-items:center}.note{background:var(--soft);color:var(--ink);padding:12px;border-radius:10px;font-size:12px;margin:15px 0}.empty{padding:35px;text-align:center;color:var(--muted)}.mobilemenu{display:none}.footer{font-size:11px;color:var(--muted);margin-top:30px}table{width:100%;border-collapse:collapse}th,td{padding:12px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:11px}.bar{height:7px;border-radius:8px;background:#e9eef4;overflow:hidden}.bar div{height:100%;background:#35aa80}.mini{font-size:12px;color:var(--muted)}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:720px){.sidebar{display:none;position:fixed;z-index:4;box-shadow:0 0 0 100vmax #0006}.sidebar.open{display:block}.mobilemenu{display:inline-block}.top{padding:12px 16px}.content{padding:20px 16px}.services{grid-template-columns:repeat(2,1fr)}.stats{gap:9px}.card{padding:15px}h1{font-size:24px}.metric{font-size:23px}.role{max-width:160px}}
</style></head><body><div class="app">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">L</div><div><b>LGS SUPER APPS</b><small>Ground Support System</small></div></div><div id="navlist"></div></aside>
<main class="main"><header class="top"><div><button class="iconbtn mobilemenu" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button> <b id="topTitle">Overview</b> <span class="mini"> / Lion Group GSE</span></div><div class="topright"><select class="role" id="role" onchange="setRole(this.value)"><option value="avsec">AVSEC</option><option value="ramp">Ramp / Ground Handling</option><option value="mechanic">Mekanik</option><option value="operator">GSE Operator</option><option value="pic">GSE Leader / PIC</option><option value="management">Management</option></select><button class="iconbtn" id="themeBtn" onclick="toggleTheme()" title="Switch theme">☾</button><button class="iconbtn" onclick="go('points')" title="My points">★ <span id="topPoints">0</span></button></div></header><div class="content" id="content"></div></main></div>
<div class="modalwrap" id="modal"><div class="modal"><div class="modalhead"><h2 id="modalTitle">Report</h2><button class="iconbtn" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<script>
const modules=[
{id:'home',name:'Dashboard',icon:'⌂',group:'GENERAL',roles:['all']},
{id:'points',name:'My LGS Points',icon:'★',group:'GENERAL',roles:['all']},
{id:'tunjuk',name:'Report Tunjuk Sebut',icon:'✓',group:'REPORTING',roles:['avsec','ramp','mechanic','pic']},
{id:'incident',name:'Report Incident',icon:'⚠',group:'REPORTING',roles:['all']},
{id:'rk',name:'Lapor RK',icon:'▤',group:'REPORTING',roles:['all']},
{id:'readiness',name:'GSE Readiness',icon:'◉',group:'OPERATIONS',roles:['operator','pic','management']},
{id:'dailycheck',name:'Daily Check',icon:'☑',group:'OPERATIONS',roles:['operator','pic']},
{id:'daily',name:'Daily Monitor',icon:'▦',group:'OPERATIONS',roles:['operator','pic']},
{id:'sop',name:'SOP GSE',icon:'▣',group:'REFERENCE',roles:['all']},
{id:'maintenance',name:'Maintenance',icon:'⚙',group:'OPERATIONS',roles:['mechanic','pic','management']},
{id:'analytics',name:'Analytics',icon:'▥',group:'MANAGEMENT',roles:['pic','management']},
{id:'tba',name:'To Be Announced',icon:'＋',group:'GENERAL',roles:['all']}
];
const initial=[{id:1,type:'tunjuk',title:'Tunjuk Sebut • GPU-014',who:'Reporter: AVSEC • Operator: GSE Operator',date:'14 Oct 2026',status:'Verified',points:2},{id:2,type:'incident',title:'Incident • BCL-002',who:'Ground Handling',date:'13 Oct 2026',status:'Under Review',points:0}];
let reports=JSON.parse(localStorage.getItem('lgs_reports')||'null')||initial;
let role=localStorage.getItem('lgs_role')||'avsec',page='home',theme=localStorage.getItem('lgs_theme')||'light';
document.documentElement.dataset.theme=theme;document.getElementById('role').value=role;
function allowed(m){return m.roles.includes('all')||m.roles.includes(role)}
function earned(){return reports.filter(r=>r.status==='Verified').reduce((s,r)=>s+(r.type==='tunjuk'?1:0),0)}
function nav(){let last='',out='';modules.filter(allowed).forEach(m=>{if(last!==m.group){last=m.group;out+=`<div class="navlabel">${last}</div>`}out+=`<button class="nav ${page===m.id?'active':''}" onclick="go('${m.id}')">${m.icon} &nbsp; ${m.name}</button>`});document.getElementById('navlist').innerHTML=out;document.getElementById('topPoints').textContent=earned()}
function setRole(r){role=r;localStorage.setItem('lgs_role',r);if(!allowed(modules.find(m=>m.id===page)))page='home';render()}
function toggleTheme(){theme=theme==='light'?'dark':'light';document.documentElement.dataset.theme=theme;localStorage.setItem('lgs_theme',theme);document.getElementById('themeBtn').textContent=theme==='light'?'☾':'☀'}
function go(p){page=p;document.getElementById('sidebar').classList.remove('open');render()}
function service(m){return `<button class="service" onclick="go('${m.id}')"><span class="glyph">${m.icon}</span><strong>${m.name}</strong><span>Open module →</span></button>`}
function activity(r){return `<div class="activity"><div><b>${esc(r.title)}</b><small>${esc(r.who)} • ${esc(r.date)}</small></div><span class="pill">${esc(r.status)}</span></div>`}
function header(title,subtitle,action=''){return `<div class="heading"><div><div class="eyebrow">LGS / ${esc(title.toUpperCase())}</div><h1>${esc(title)}</h1><p>${subtitle}</p></div>${action}</div>`}
function home(){let access=modules.filter(m=>allowed(m)&&!['home','points','tba','analytics'].includes(m.id));return header('Good Afternoon! 👋','Your operational workspace, reporting tools, and contributions.')+`<div class="stats"><div class="card"><div class="sub">My Points</div><div class="metric">★ ${earned()}</div><span class="mini">Verified contributions</span></div><div class="card"><div class="sub">Reports Submitted</div><div class="metric">${reports.length}</div><span class="mini">Prototype data</span></div><div class="card"><div class="sub">Verified Reports</div><div class="metric">${reports.filter(r=>r.status==='Verified').length}</div><span class="mini">Approved reports</span></div><div class="card"><div class="sub">Pending Review</div><div class="metric">${reports.filter(r=>r.status==='Under Review').length}</div><span class="mini">Awaiting verification</span></div></div><div class="grid"><div class="card"><h2>Quick Access</h2><div class="services">${access.map(service).join('')}</div></div><div><div class="card points"><div class="sub">LGS POINTS</div><div class="metric">★ ${earned()} <span style="font-size:15px">PTS</span></div><p>Track your verified activities and contributions.</p><button class="btn" style="margin-top:15px;background:white;color:#17243a" onclick="go('points')">View My Points →</button></div><div class="card section"><h2>Recent Activities</h2>${reports.slice().reverse().slice(0,4).map(activity).join('')}</div></div></div>`}
function points(){return header('My LGS Points','Your accumulated points from verified operational activities.')+`<div class="grid"><div class="card points"><div class="sub">TOTAL ACCUMULATED POINTS</div><div class="metric">★ ${earned()} PTS</div><p>Points are recorded after activity verification.</p><div style="border-top:1px solid #526580;margin-top:25px;padding-top:15px">This month &nbsp; <b>+${earned()} PTS</b></div></div><div class="card"><h2>Points Breakdown</h2><div class="activity"><span>Reporting Points</span><b>${earned()} PTS</b></div><div class="activity"><span>Operator Compliance Points</span><b>—</b></div><p class="mini">Operator points are calculated separately for each verified operator ID when employee data is integrated.</p></div></div><div class="card section"><h2>Points History</h2>${reports.filter(r=>r.type==='tunjuk'&&r.status==='Verified').map(r=>`<div class="activity"><div><b>${esc(r.title)}</b><small>${esc(r.date)} • Verified</small></div><span class="tag">+1 PTS</span></div>`).join('')||'<div class="empty">No verified points yet.</div>'}<div class="note">Points are currently an activity recognition record. No redemption value or reward entitlement has been established.</div></div>`}
function modulePage(m){let descriptions={tunjuk:'Record and monitor Tunjuk Sebut observations across departments.',incident:'Submit incident reports and track review status.',rk:'Submit RK reports and follow up their status.',readiness:'Monitor serviceable and unserviceable equipment.',daily:'Daily monitoring of motorized and non-motorized GSE.',sop:'Access operational SOP documents by equipment category.',maintenance:'Maintenance reports, work orders and equipment history.',analytics:'Performance overview and operational reports.',tba:'Future modules will be available here.'};let canReport=['tunjuk','incident','rk','daily','maintenance'].includes(m.id);return header(m.name,descriptions[m.id]||'',canReport?`<button class="btn" onclick="openReport('${m.id}')">＋ New Report</button>`:'')+(m.id==='tba'?'<div class="card empty">More services are being planned.</div>':m.id==='sop'?`<div class="card"><h2>SOP Library</h2>${['Aircraft Towing Tractor (ATT)','Ground Power Unit (GPU)','Belt Loader','Passenger Boarding Stairs','Air Conditioning Unit (ACU)'].map(x=>`<div class="activity"><span>▣ ${x}</span><span class="mini">Document placeholder</span></div>`).join('')}</div>`:m.id==='readiness'?`<div class="stats">${[['Total Units','1,248'],['Serviceable','1,183'],['Unserviceable','65'],['Readiness','94.8%']].map(a=>`<div class="card"><div class="sub">${a[0]}</div><div class="metric">${a[1]}</div></div>`).join('')}</div><div class="card section"><h2>Readiness by Equipment Type</h2>${[['GPU',96],['Belt Loader',92],['ATT',98],['PBS',91]].map(x=>`<div class="activity" style="display:block"><div style="display:flex;justify-content:space-between"><b>${x[0]}</b><span>${x[1]}%</span></div><div class="bar"><div style="width:${x[1]}%"></div></div></div>`).join('')}<p class="mini">Illustrative data only</p></div>`:m.id==='analytics'?`<div class="stats">${[['Submitted',reports.length],['Verified',reports.filter(r=>r.status==='Verified').length],['Pending',reports.filter(r=>r.status==='Under Review').length],['Points Issued',earned()*2]].map(x=>`<div class="card"><div class="sub">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join('')}</div>`:`<div class="card"><h2>Report History</h2>${reports.filter(r=>r.type===m.id).map(activity).join('')||'<div class="empty">No reports yet. Select New Report to get started.</div>'}</div>`)}
function openReport(type){document.getElementById('modalTitle').textContent='New '+modules.find(m=>m.id===type).name;document.getElementById('modalBody').innerHTML=`<form id="reportForm"><div class="field"><label>Reporter ID</label><input name="reporter" required placeholder="e.g. LG12345"></div>${type==='tunjuk'?'<div class="field"><label>Operator Employee ID</label><input name="operator" required placeholder="e.g. LG54321"></div>':''}<div class="field"><label>Station</label><select name="station"><option>CGK</option><option>SUB</option><option>DPS</option><option>UPG</option><option>KNO</option></select></div><div class="field"><label>GSE Unit Number</label><input name="unit" required placeholder="e.g. GPU-014"></div><div class="field"><label>Observation / Description</label><textarea name="desc" required placeholder="Enter observation details..."></textarea></div><div class="note">Demo only: submitting saves data in this browser and marks it Under Review. No points are awarded until verified.</div><button class="btn" type="submit">Submit Report</button></form>`;document.getElementById('reportForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),id=Date.now();reports.push({id,type,title:modules.find(m=>m.id===type).name+' • '+f.get('unit'),who:'Reporter: '+f.get('reporter')+(f.get('operator')?' • Operator: '+f.get('operator'):''),date:new Date().toLocaleDateString('en-GB'),status:'Under Review',points:0});localStorage.setItem('lgs_reports',JSON.stringify(reports));closeModal();render();alert('Demo report saved locally. Status: Under Review.')};document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){nav();let m=modules.find(m=>m.id===page);document.getElementById('topTitle').textContent=m.name;document.getElementById('content').innerHTML=page==='home'?home():page==='points'?points():page==='dailycheck'?dailyCheckPage():modulePage(m)}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});render();
</script>
<style>
.dc-steps{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}.dc-step{padding:9px 13px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;font-size:12px}.dc-step.current{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:800}
.dc-choice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.dc-tile{position:relative;overflow:hidden;min-height:225px;text-align:left;border:1px solid var(--line);border-radius:19px;background:var(--surface);color:var(--ink);padding:24px;display:flex;flex-direction:column;justify-content:flex-end;transition:.2s}.dc-tile:hover,.dc-equipment:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow)}.dc-heroicon{position:absolute;right:20px;top:12px;font-size:90px;opacity:.14}.dc-tile .dc-emoji{font-size:38px;margin-bottom:12px}.dc-tile strong{font-size:23px}.dc-tile small{font-size:12px;color:var(--muted)}.dc-equipment-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.dc-equipment{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:17px;min-height:157px;text-align:left;transition:.2s;display:flex;flex-direction:column}.dc-equipment .pic{font-size:52px;line-height:1.25;filter:drop-shadow(0 4px 7px #0001)}.dc-equipment strong{margin-top:auto;font-size:17px}.dc-equipment small{color:var(--muted)}.dc-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 18px;flex-wrap:wrap}.dc-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.dc-check{padding:14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.dc-check:last-child{border:0}.dc-check b{display:block;font-size:13px}.dc-check small{color:var(--muted)}.dc-options{display:flex;gap:6px}.dc-options label{cursor:pointer}.dc-options input{position:absolute;opacity:0}.dc-options span{display:block;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:11px}.dc-options input:checked+span{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:800}.dc-banner{border-radius:13px;background:var(--soft);padding:15px;margin:15px 0}.dc-form-footer{display:flex;justify-content:flex-end;gap:10px;margin:20px 0}.dc-status{display:inline-block;border-radius:99px;background:#e5f8f0;color:#137d5c;padding:4px 10px;font-size:11px;font-weight:700}.dc-status.issue{background:#fff0dc;color:#a65b11}
@media(max-width:950px){.dc-equipment-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.dc-choice,.dc-two{grid-template-columns:1fr}.dc-equipment-grid{grid-template-columns:repeat(2,1fr)}.dc-check{grid-template-columns:1fr}.dc-tile{min-height:175px}}
</style>
<script>
const dcCatalog={
 motorized:[
 ['ATT','Aircraft Towing Tractor','🚜'],['BTT','Baggage Towing Tractor','🚜'],['AOV','Airport Operations Vehicle','🚙'],['CBL','Conveyor Belt Loader','🛞'],['GPU AC','Ground Power Unit AC','🔌'],['GPU DC','Ground Power Unit DC','⚡'],['GPU AC/DC','Ground Power Unit AC/DC','🔋'],['APB','Passenger Boarding Vehicle','🚐'],['ACU','Air Conditioning Unit','❄️'],['ASU','Air Starter Unit','💨'],['WST','Water Service Truck','🚚'],['LST','Lavatory Service Truck','🚛'],['TR','Transporter','🚜'],['BU','Bus','🚌'],['PU','Pick Up','🛻'],['HCT','High Catering Truck','🚚'],['E-AOV','Electric AOV','🚙'],['OTHER','Other Motorized GSE','⚙️']],

const dcSpecial={'ATT':[['Tow hitch / coupling','Kondisi sambungan penarik'],['Interlock / warning','Fungsi fitur sesuai spesifikasi']],'BTT':[['Tow hitch / coupling','Kondisi sambungan penarik']],'CBL':[['Conveyor belt','Kondisi belt, roller, guard'],['Emergency stop','Kondisi dan fungsi E-stop']],'GPU AC':[['Cable / connector','Kondisi kabel dan konektor']],'GPU DC':[['Cable / connector','Kondisi kabel dan konektor']],'GPU AC/DC':[['Cable / connector','Kondisi kabel dan konektor']],'TPS':[['Tangga, handrail & platform','Kondisi anak tangga dan railing']],'PS':[['Tangga, handrail & platform','Kondisi anak tangga dan railing']],'ATB':[['Tow bar head / pin','Kondisi pin dan head tow bar']],'BCT':[['Pintu / pengunci cart','Kondisi pintu dan latch']],'CDL':[['Deck & locking','Kondisi permukaan dan pengunci']]};
let dcStep=0,dcKind='',dcCode='',dcSearch='',dcDraft=null;
let dcRecords=JSON.parse(localStorage.getItem('lgs_dailycheck_records')||'[]');
function dcStore(){localStorage.setItem('lgs_dailycheck_records',JSON.stringify(dcRecords))}
function dcStart(){dcStep=0;dcKind='';dcCode='';dcDraft=null;render()}
function dcSelectKind(k){dcKind=k;dcStep=1;dcSearch='';render()}
function dcSelectCode(k){dcCode=k;dcStep=2;dcDraft=null;render()}
function dcBack(){dcStep=Math.max(0,dcStep-1);render()}
function dcCard(k){let x=dcCatalog[dcKind].find(x=>x[0]===k);return `<button class="dc-equipment" onclick="dcSelectCode('${k}')"><span class="pic">${x[2]}</span><strong>${esc(x[0])}</strong><small>${esc(x[1])}</small></button>`}
function dcCheckRows(){let checks=[...dcCommon,...(dcKind==='motorized'?dcMotor:dcNon),...(dcSpecial[dcCode]||[])];return checks.map(([name,hint],i)=>`<div class="dc-check"><div><b>${i+1}. ${esc(name)}</b><small>${esc(hint)}</small></div><div class="dc-options">${[['OK','OK'],['NG','NG'],['NA','N/A']].map(([v,t])=>`<label><input type="radio" name="check_${i}" value="${v}" required><span>${t}</span></label>`).join('')}</div></div>`).join('')}
function dcForm(){let x=dcCatalog[dcKind].find(x=>x[0]===dcCode);return `<div class="dc-toolbar"><button class="btn secondary" onclick="dcBack()">← Change Equipment</button><span class="dc-status">${dcKind==='motorized'?'MOTORIZED':'NON-MOTORIZED'} · ${esc(dcCode)}</span></div><div class="card"><div style="display:flex;align-items:center;gap:16px"><div style="font-size:50px">${x[2]}</div><div><h2 style="margin:0">${esc(x[1])}</h2><p>Daily Check • ${esc(dcCode)}</p></div></div><div class="dc-banner"><b>Prototype checklist</b><br><span class="mini">Item pemeriksaan ini merupakan rancangan UI untuk demonstrasi. Sebelum digunakan secara resmi, sesuaikan dengan Matrix Mandatory Daily Check dan checklist GSE yang berlaku.</span></div><form id="dcForm" onsubmit="dcSubmit(event)"><div class="dc-two"><div class="field"><label>Station *</label><input name="station" required placeholder="e.g. CGK" maxlength="15"></div><div class="field"><label>Unit / Registration *</label><input name="unit" required placeholder="e.g. BTT-001"></div><div class="field"><label>Operator / Inspector ID *</label><input name="inspector" required placeholder="Employee ID"></div><div class="field"><label>Date & Time *</label><input name="date" type="datetime-local" required value="${new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16)}"></div></div><h2 style="margin-top:22px">Inspection Checklist</h2><div class="mini">Pilih OK, NG (Not Good), atau N/A untuk setiap item.</div><div style="margin-top:10px">${dcCheckRows()}</div><div class="field"><label>Findings / Remarks</label><textarea name="remarks" placeholder="Catat temuan, kerusakan, atau informasi tambahan..."></textarea></div><div class="dc-form-footer"><button class="btn secondary" type="button" onclick="dcBack()">Back</button><button class="btn" type="submit">Submit Daily Check →</button></div></form></div>`}
function dcSubmit(e){e.preventDefault();let fd=new FormData(e.target),checks=[...dcCommon,...(dcKind==='motorized'?dcMotor:dcNon),...(dcSpecial[dcCode]||[])];let results=checks.map(([name],i)=>({name,result:fd.get('check_'+i)}));if(results.some(x=>!x.result)){alert('Please complete all inspection items.');return}let hasNG=results.some(x=>x.result==='NG');if(hasNG&&!String(fd.get('remarks')||'').trim()){alert('Please describe the NG findings in Remarks.');return}let r={id:Date.now(),kind:dcKind,code:dcCode,station:fd.get('station'),unit:fd.get('unit'),inspector:fd.get('inspector'),date:fd.get('date'),remarks:fd.get('remarks'),checks:results,status:hasNG?'Needs Review':'Submitted',ng:results.filter(x=>x.result==='NG').length};dcRecords.unshift(r);dcStore();dcStep=3;dcDraft=r;render()}
function dcHistory(){return `<div class="card section"><h2>Recent Daily Checks <span class="mini">(${dcRecords.length} saved locally)</span></h2>${dcRecords.length?`<div style="overflow:auto"><table><thead><tr><th>Date</th><th>Station</th><th>Equipment</th><th>Unit</th><th>Inspector</th><th>NG</th><th>Status</th></tr></thead><tbody>${dcRecords.slice(0,12).map(r=>`<tr><td>${esc(r.date.replace('T',' '))}</td><td>${esc(r.station)}</td><td>${esc(r.code)}</td><td>${esc(r.unit)}</td><td>${esc(r.inspector)}</td><td>${r.ng}</td><td><span class="dc-status ${r.ng?'issue':''}">${esc(r.status)}</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No daily checks submitted yet.</div>'}<p class="mini">Demo: data tersimpan di browser ini saja, belum terhubung ke Google Sheets dan belum melalui validasi Leader/PIC.</p></div>`}
function dailyCheckPage(){let out=header('Daily Check GSE','Choose equipment category, select the GSE type, then complete the inspection form.');out+=`<div class="dc-steps">${['1. Category','2. Equipment','3. Inspection','4. Confirmation'].map((v,i)=>`<span class="dc-step ${dcStep===i?'current':''}">${v}</span>`).join('')}</div>`;if(dcStep===0){out+=`<div class="dc-choice"><button class="dc-tile" onclick="dcSelectKind('motorized')"><span class="dc-heroicon">🚜</span><span class="dc-emoji">🚜</span><strong>Daily Check Motorized</strong><small>Tractors, vehicles, GPU, belt loaders, service trucks & more →</small></button><button class="dc-tile" onclick="dcSelectKind('nonmotorized')"><span class="dc-heroicon">🛒</span><span class="dc-emoji">🛒</span><strong>Daily Check Non-Motorized</strong><small>Carts, dollies, tow bars, stairs, stands & more →</small></button></div>`+dcHistory()}else if(dcStep===1){let items=dcCatalog[dcKind].filter(x=>x.join(' ').toLowerCase().includes(dcSearch.toLowerCase()));out+=`<div class="dc-toolbar"><button class="btn secondary" onclick="dcBack()">← Change Category</button><span class="dc-status">${dcKind==='motorized'?'MOTORIZED':'NON-MOTORIZED'}</span></div><div class="card" style="margin-bottom:16px"><div class="field" style="margin:0"><label>Find GSE Equipment</label><input placeholder="Search equipment code or name..." value="${esc(dcSearch)}" oninput="dcSearch=this.value;document.getElementById('dcGrid').innerHTML=dcCatalog[dcKind].filter(x=>x.join(' ').toLowerCase().includes(dcSearch.toLowerCase())).map(x=>dcCard(x[0])).join('')"></div></div><div class="dc-equipment-grid" id="dcGrid">${items.map(x=>dcCard(x[0])).join('')}</div>`}else if(dcStep===2){out+=dcForm()}else{out+=`<div class="card" style="text-align:center;padding:38px"><div style="font-size:55px">${dcDraft.ng?'⚠️':'✅'}</div><h1>${dcDraft.ng?'Daily Check Needs Review':'Daily Check Submitted'}</h1><p>${esc(dcDraft.unit)} · ${esc(dcDraft.station)} · ${esc(dcDraft.code)}</p><div class="dc-banner">Inspection result: <b>${dcDraft.ng} NG item(s)</b>. ${dcDraft.ng?'Report requires follow-up and is not an authorization to operate the equipment.':'This is a demo record, not an official release or validation.'}</div><button class="btn" onclick="dcStart()">＋ New Daily Check</button></div>`+dcHistory()}return out}
</script>
</body></html>
